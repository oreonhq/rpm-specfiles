<IfModule mod_maxminddb.c>
    MaxMindDBEnable On

    # The (free) GeoLite2 databases are maintained by MaxMind, but due to
    # legal implications these GeoLite2 databases are no longer available
    # under the Creative Commons Attribution-ShareAlike 4.0 International
    # License (since December 2019). Since that, the RPMs geolite2-country
    # and geolite2-city in Fedora and RHEL haven't been updated anymore.
    # While the (free) GeoLite2 databases can be still downloaded without
    # charges, it's necessary to register a MaxMind account and to obtain
    # a license key. Additionally, an end-user license agreement containing
    # the relevant data processing provisions that MaxMind and the user/
    # admin (= you) need to comply with applicable data privacy regulations
    # needs to be signed (https://www.maxmind.com/en/geolite2/eula).
#    MaxMindDBFile COUNTRY_DB /usr/share/GeoIP/GeoLite2-Country.mmdb
#    MaxMindDBFile CITY_DB    /usr/share/GeoIP/GeoLite2-City.mmdb
</IfModule>
