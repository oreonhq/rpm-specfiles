<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<match target="scan">
		<test name="family">
			<string>花園明朝A</string>
		</test>
		<edit name="family" mode="prepend">
			<string>花園明朝</string>
		</edit>
	</match>
	<match target="scan">
		<test name="family">
			<string>花園明朝B</string>
		</test>
		<edit name="family" mode="prepend">
			<string>花園明朝</string>
		</edit>
	</match>
	<match target="scan">
		<test name="family">
			<string>HanaMinA</string>
		</test>
		<edit name="family" mode="prepend">
			<string>HanaMin</string>
		</edit>
		<edit name="fullname" mode="assign">
			<string>HanaMin</string>
		</edit>
	</match>
	<match target="scan">
		<test name="family">
			<string>HanaMinB</string>
		</test>
		<edit name="family" mode="prepend">
			<string>HanaMin</string>
		</edit>
		<edit name="fullname" mode="assign">
			<string>HanaMin</string>
		</edit>
	</match>
	<match>
		<test name="lang" compare="contains">
			<string>ja</string>
		</test>
		<test name="family">
			<string>serif</string>
		</test>
		<edit name="family" mode="prepend">
			<string>HanaMin</string>
		</edit>
	</match>

	<alias binding="same">
		<family>HanaMinA</family>
		<accept>
			<family>HanaMin</family>
		</accept>
	</alias>
	<alias binding="same">
		<family>HanaMinB</family>
		<accept>
			<family>HanaMin</family>
		</accept>
	</alias>
	<alias>
		<family>HanaMin</family>
		<default>
			<family>serif</family>
		</default>
	</alias>
</fontconfig>

