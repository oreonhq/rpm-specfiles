Alias /websvn /usr/share/websvn/

<Directory /usr/share/websvn/>
   Options MultiViews FollowSymLinks
   DirectoryIndex browse.php
   <IfModule mod_authz_core.c>
      # Apache 2.4
      Require local
   </IfModule>
   <IfModule !mod_authz_core.c>
      # Apache 2.2
      order deny,allow
      deny from all
      allow from 127.0.0.1 ::1
   </IfModule>
</Directory>
