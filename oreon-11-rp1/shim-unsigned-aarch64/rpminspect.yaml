# rpminspect configuration (Oreon HQ). Point profiledir/vendor_data_dir at your install.

---
common:
    workdir: /var/tmp/rpminspect
    profiledir: /usr/share/rpminspect/profiles/generic
commands:
    msgunfmt: msgunfmt
    desktop-file-validate: desktop-file-validate
    abidiff: abidiff
    kmidiff: kmidiff
    annocheck: annocheck
    udevadm: udevadm
vendor:
    vendor_data_dir: /usr/share/rpminspect
    favor_release: newest
inspections:
    abidiff: off
    disttag: off
    manpage: off
    javabytecode: off
metadata:
    vendor: Oreon HQ
    buildhost_subdomain:
        - .oreonhq.com
