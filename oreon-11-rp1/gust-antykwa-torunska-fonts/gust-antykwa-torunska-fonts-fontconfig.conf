<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <test name="family"><string>Antykwa Torunska</string></test>
  </match>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AntykwaTorunska</family>
    </prefer>
  </alias>
  <alias>
    <family>AntykwaTorunska</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AntykwaTorunska Light</family>
    </prefer>
  </alias>
  <alias>
    <family>AntykwaTorunska Light</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AntykwaTorunska Medium</family>
    </prefer>
  </alias>
  <alias>
    <family>AntykwaTorunska Medium</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AntykwaTorunskaCond</family>
    </prefer>
  </alias>
  <alias>
    <family>AntykwaTorunskaCond</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AntykwaTorunskaCond Light</family>
    </prefer>
  </alias>
  <alias>
    <family>AntykwaTorunskaCond Light</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AntykwaTorunskaCond Medium</family>
    </prefer>
  </alias>
  <alias>
    <family>AntykwaTorunskaCond Medium</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
</fontconfig>
