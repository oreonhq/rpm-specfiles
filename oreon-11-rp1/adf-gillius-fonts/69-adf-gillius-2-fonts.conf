<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: MIT -->
<fontconfig>
  <alias>
    <family>Sans</family>
    <prefer>
      <family>Gillius ADF No2</family>
    </prefer>
  </alias>
  <alias>
    <family>Gillius ADF No2</family>
    <default>
      <family>Sans</family>
    </default>
  </alias>
</fontconfig>
