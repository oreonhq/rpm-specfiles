<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <test name="family">
            <string>Old Standard</string>
        </test>
    </match>
    <match target="pattern">
        <test name="family">
            <string>serif</string>
        </test>
    </match>
    <alias binding="same">
        <family>Old Standard</family>
        <accept>
        <family>Old Standard TTF</family>
        </accept>
   </alias>
   <alias binding="same">
        <family>Old Standard</family>
        <accept>
        <family>Old Standard SFD</family>
        </accept>
   </alias>
   <alias>
        <family>serif</family>
        <prefer>
        <family>Old Standard SFD</family>
        </prefer>
   </alias>

</fontconfig>

