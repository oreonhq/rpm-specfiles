<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ume P Gothic C4</family>
    </prefer>
  </alias>
  <alias>
    <family>Ume P Gothic C4</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ume P Gothic C5</family>
    </prefer>
  </alias>
  <alias>
    <family>Ume P Gothic C5</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ume P Gothic</family>
    </prefer>
  </alias>
  <alias>
    <family>Ume P Gothic</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ume P Gothic O5</family>
    </prefer>
  </alias>
  <alias>
    <family>Ume P Gothic O5</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ume P Gothic S4</family>
    </prefer>
  </alias>
  <alias>
    <family>Ume P Gothic S4</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ume P Gothic S5</family>
    </prefer>
  </alias>
  <alias>
    <family>Ume P Gothic S5</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
</fontconfig>
