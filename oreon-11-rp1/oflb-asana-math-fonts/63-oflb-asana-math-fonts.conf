<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>pxfonts</family>
    <accept>
      <family>Asana Math</family>
    </accept>
  </alias>
  <alias>
    <family>Asana Math</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Asana Math</family>
    </prefer>
  </alias>
</fontconfig>
