<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic names -->
  <alias>
    <family>UnBom</family>
    <default>
      <family>fantasy</family>
    </default>
  </alias>
  <!-- Locale-specific overrides rule -->
  <match>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family">
      <string>fantasy</string>
    </test>
    <edit name="family" mode="prepend">
      <string>UnBom</string>
    </edit>
  </match>
</fontconfig>
