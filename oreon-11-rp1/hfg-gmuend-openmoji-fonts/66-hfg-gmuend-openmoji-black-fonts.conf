<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="scan">
    <test name="family">
      <string>OpenMoji</string>
    </test>
    <test name="style">
      <string>Black</string>
    </test>
    <edit name="family">
      <string>OpenMoji Black</string>
    </edit>
    <edit name="style">
      <string>Regular</string>
    </edit>
  </match>
  <alias binding="same">
    <family>OpenMoji</family>
    <accept>
      <family>OpenMoji Black</family>
    </accept>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>OpenMoji Black</family>
    </prefer>
  </alias>
  <alias>
    <family>OpenMoji Black</family>
    <default>
      <family>emoji</family>
    </default>
  </alias>
</fontconfig>
