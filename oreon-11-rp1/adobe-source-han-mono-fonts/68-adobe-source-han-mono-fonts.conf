<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic names rule -->
  <alias>
    <family>Source Han Mono</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <alias>
    <family>Source Han Mono K</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <alias>
    <family>Source Han Mono SC</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <alias>
    <family>Source Han Mono TC</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <alias>
    <family>Source Han Mono HC</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <!-- Locale-specific overrides rule -->
  <match>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" ignore-blanks="true">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Source Han Mono</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family" ignore-blanks="true">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Source Han Mono K</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <test name="family" ignore-blanks="true">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Source Han Mono SC</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <test name="family" ignore-blanks="true">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Source Han Mono TC</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-hk</string>
    </test>
    <test name="family" ignore-blanks="true">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Source Han Mono HC</string>
    </edit>
  </match>
</fontconfig>
