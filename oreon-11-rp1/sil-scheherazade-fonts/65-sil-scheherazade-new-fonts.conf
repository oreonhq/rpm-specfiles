<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Scheherazade New</family>
    </prefer>
  </alias>
  <alias>
    <family>Scheherazade New</family>
    <default>
      <family>serif</family>
    </default>
  </alias>
  <alias binding="same">
    <family>Monotype Naskh</family>
    <accept>
      <family>Scheherazade New</family>
    </accept>
  </alias>
  <match target="font">
    <test name="family" compare="eq">
      <string>Scheherazade New</string>
    </test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1.2</double>  <double>0</double>
          <double>0</double>    <double>1.2</double>
        </matrix>
      </times>
    </edit>
  </match>
</fontconfig>
