<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

<match>
  <test name="lang" compare="contains">
    <string>ta</string>
  </test>
  <test name="family">
    <string>serif</string>
  </test>
  <edit name="family" mode="prepend">
    <string>Mukta Malar</string>
  </edit>
</match>

<match target="font">
  <test name="family" compare="eq">
    <string>Mukta Malar</string>
  </test>
  <edit name="autohint" mode="assign">
    <bool>true</bool>
  </edit>
</match>

<alias>
  <family>Mukta Malar</family>
  <default>
    <family>serif</family>
  </default>
</alias>

</fontconfig>
