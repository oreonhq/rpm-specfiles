# rpminspect configuration (Oreon). Point profiledir/vendor_data_dir at your
# local rpminspect install if not using Fedora’s paths.

---
common:
    workdir: /var/tmp/rpminspect
    profiledir: /usr/share/rpminspect/profiles/fedora
koji:
    hub: https://koji.fedoraproject.org/kojihub
    download_ursine: https://kojipkgs.fedoraproject.org
    download_mbs: https://kojipkgs.fedoraproject.org
commands:
    msgunfmt: msgunfmt
    desktop-file-validate: desktop-file-validate
    abidiff: abidiff
    kmidiff: kmidiff
    annocheck: annocheck
    udevadm: udevadm
vendor:
    vendor_data_dir: /usr/share/rpminspect
    licensedb:
        - /usr/share/fedora-license-data/licenses/fedora-licenses.json
    favor_release: newest
inspections:
    abidiff: off
    disttag: off
    manpage: off
    javabytecode: off
metadata:
    vendor: Oreon HQ
    buildhost_subdomain:
        - .oreonhq.com
        - .fedoraproject.org
        - .bos.redhat.com
