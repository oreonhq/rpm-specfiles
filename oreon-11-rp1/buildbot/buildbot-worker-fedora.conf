# Fedora uses separate buildbot-worker / buildbot-master users and places
# worker data under /var/lib/buildbot/worker/ instead of /var/lib/buildbot/.
# ProtectHome=no allows symlinking worker data from /home when the root
# partition is too small.

# Clear upstream conditions and set Fedora paths
[Unit]
ConditionDirectoryNotEmpty=
ConditionDirectoryNotEmpty=/var/lib/buildbot/worker/%i
ConditionFileNotEmpty=
ConditionFileNotEmpty=/var/lib/buildbot/worker/%i/buildbot.tac

[Service]
User=buildbot-worker
Group=buildbot-worker
WorkingDirectory=/var/lib/buildbot/worker/%i
# Clear upstream StateDirectory=buildbot to avoid chown conflicts
# with the separate buildbot-worker user
StateDirectory=
# ExecStart must be cleared before override in drop-ins
ExecStart=
ExecStart=/usr/bin/buildbot-worker start --nodaemon /var/lib/buildbot/worker/%i
ProtectHome=no
