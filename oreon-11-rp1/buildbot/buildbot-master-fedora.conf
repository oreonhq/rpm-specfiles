# Fedora uses separate buildbot-worker / buildbot-master users and places
# master data under /var/lib/buildbot/master/ instead of /var/lib/buildbot/.
# ProtectHome=no allows symlinking master data from /home when the root
# partition is too small.

# Clear upstream conditions and set Fedora paths
[Unit]
ConditionDirectoryNotEmpty=
ConditionDirectoryNotEmpty=/var/lib/buildbot/master/%i
ConditionFileNotEmpty=
ConditionFileNotEmpty=/var/lib/buildbot/master/%i/buildbot.tac
ConditionFileNotEmpty=/var/lib/buildbot/master/%i/master.cfg

[Service]
User=buildbot-master
Group=buildbot-master
WorkingDirectory=/var/lib/buildbot/master/%i
# Clear upstream StateDirectory=buildbot to avoid chown conflicts
# with the separate buildbot-master user
StateDirectory=
# ExecStart must be cleared before override in drop-ins
ExecStart=
ExecStart=/usr/bin/buildbot start --nodaemon /var/lib/buildbot/master/%i
ProtectHome=no
