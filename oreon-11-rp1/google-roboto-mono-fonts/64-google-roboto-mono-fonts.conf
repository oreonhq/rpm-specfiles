<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: ASL-2.0 -->
<fontconfig>
  <alias>
    <family>Monospace</family>
    <prefer>
      <family>Roboto Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>Roboto Mono</family>
    <default>
      <family>Monospace</family>
    </default>
  </alias>
</fontconfig>
