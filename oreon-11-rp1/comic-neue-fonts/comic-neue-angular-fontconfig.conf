<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Comic Neue Angular</family>
    </prefer>
  </alias>
  <alias>
    <family>Comic Neue Angular</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias binding="same">
    <family>Comic Sans</family>
    <accept>
      <family>Comic Neue Angular</family>
    </accept>
  </alias>
</fontconfig>
