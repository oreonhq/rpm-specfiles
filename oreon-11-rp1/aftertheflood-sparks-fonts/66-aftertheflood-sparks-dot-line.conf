<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "../fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Spark Dot-line Extrathick</family>
    </prefer>
  </alias>
  <alias>
    <family>Spark Dot-line Extrathick</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Spark Dot-line Extrathin</family>
    </prefer>
  </alias>
  <alias>
    <family>Spark Dot-line Extrathin</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Spark Dot-line Medium</family>
    </prefer>
  </alias>
  <alias>
    <family>Spark Dot-line Medium</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Spark Dot-line Thick</family>
    </prefer>
  </alias>
  <alias>
    <family>Spark Dot-line Thick</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Spark Dot-line Thin</family>
    </prefer>
  </alias>
  <alias>
    <family>Spark Dot-line Thin</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <match target="font">
    <test name="family" compare="eq">
      <string>Spark Dot-line Extrathick</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Spark Dot-line Extrathin</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Spark Dot-line Medium</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Spark Dot-line Thick</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Spark Dot-line Thin</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
