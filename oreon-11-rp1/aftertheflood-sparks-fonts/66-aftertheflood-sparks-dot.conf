<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "../fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Dot Extralarge</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Dot Extralarge</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Dot Extrasmall</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Dot Extrasmall</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Dot Large</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Dot Large</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Dot Medium</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Dot Medium</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Dot Small</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Dot Small</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Dot Extralarge</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Dot Extrasmall</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Dot Large</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Dot Medium</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Dot Small</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
