<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "../fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Bar Extranarrow</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Bar Extranarrow</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Bar Extrawide</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Bar Extrawide</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Bar Medium</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Bar Medium</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Bar Narrow</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Bar Narrow</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sparks Bar Wide</family>
    </prefer>
  </alias>
  <alias>
    <family>Sparks Bar Wide</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Bar Extranarrow</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Bar Extrawide</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Bar Medium</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Bar Narrow</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Sparks Bar Wide</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
