<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: MIT -->
<fontconfig>
  <match target="scan">
    <test name="family">
      <string>IBM 3270</string>
    </test>
    <edit name="fontversion">
      <int>2</int>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>IBM 3270 Condensed</string>
    </test>
    <edit name="family">
      <string>IBM 3270</string>
    </edit>
    <edit name="fullname">
      <string>IBM 3270 Condensed</string>
    </edit>
    <edit name="fontversion">
      <int>1</int>
    </edit>
  </match>
  <alias binding="same">
    <family>IBM 3270 Condensed</family>
    <accept>
      <family>IBM 3270</family>
    </accept>
  </alias>
  <match target="scan">
    <test name="family">
      <string>IBM 3270 Semi-Condensed</string>
    </test>
    <edit name="family">
      <string>IBM 3270</string>
    </edit>
    <edit name="fullname">
      <string>IBM 3270 SemiCondensed</string>
    </edit>
    <edit name="fontversion">
      <int>1</int>
    </edit>
  </match>
  <alias binding="same">
    <family>IBM 3270 Semi-Condensed</family>
    <accept>
      <family>IBM 3270</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM 3270</family>
    </prefer>
  </alias>
  <alias>
    <family>IBM 3270</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
</fontconfig>
