name: SRPM Build

on:
  pull_request_target:
    paths:
      - "**/*.spec"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed package directories
        id: find
        run: |
          pkgs=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.sha }}" \
            | grep '\.spec$' \
            | xargs -r -I{} dirname {} \
            | sort -u \
            | jq -Rc '.' | jq -sc '.')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  srpm:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ${{ matrix.arch.runner }}
    container:
      image: fedora:44
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.detect.outputs.packages) }}
        arch:
          - { runner: ubuntu-latest, name: amd64 }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
    name: srpm / ${{ matrix.arch.name }} / ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: dnf install -y --quiet rpm-build rpmdevtools

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Stage spec and local sources
        run: |
          spec=$(find "${{ matrix.pkg }}" -name '*.spec' | head -1)
          cp "$spec" ~/rpmbuild/SPECS/
          find "${{ matrix.pkg }}" -type f ! -name '*.spec' | xargs -r cp -t ~/rpmbuild/SOURCES/

      - name: Fetch remote sources
        run: |
          spec=$(find "${{ matrix.pkg }}" -name '*.spec' | head -1)
          spectool -g -C ~/rpmbuild/SOURCES/ --define "dist .oreon11" "$spec" || true

      - name: Build SRPM
        run: |
          spec=$(basename "$(find "${{ matrix.pkg }}" -name '*.spec' | head -1)")
          rpmbuild -bs --define "dist .oreon11" ~/rpmbuild/SPECS/"$spec"

      - name: Set artifact name
        id: meta
        if: success()
        run: echo "name=srpm-${{ matrix.arch.name }}-$(basename '${{ matrix.pkg }}')" >> "$GITHUB_OUTPUT"

      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.meta.outputs.name }}
          path: /root/rpmbuild/SRPMS/*.src.rpm

  report:
    needs: [detect, srpm]
    if: always() && needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: { jobs: allJobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const srpmJobs = allJobs.filter(j => j.name.startsWith('srpm /'));
            const icon = c => ({ success: '✅', failure: '❌', cancelled: '⏸️' }[c] ?? '⏳');

            const rows = srpmJobs.map(j => {
              const [, arch, ...rest] = j.name.split(' / ');
              const pkg = rest.join(' / ').split('/').pop();
              const url = j.html_url;
              return `| [\`${pkg}\`](${url}) | ${arch} | ${icon(j.conclusion)} ${j.conclusion ?? 'in progress'} |`;
            }).join('\n');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- oreon-ci-srpm -->';
            const body = [
              marker,
              `### SRPM Build — [run #${context.runNumber}](${runUrl})`,
              '',
              '| Package | Architecture | Result |',
              '|---------|-------------|--------|',
              rows,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
