name: Spec Lint

on:
  pull_request_target:
    paths:
      - "**/*.spec"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Find changed package directories
        id: find
        run: |
          pkgs=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
            | grep '\.spec$' \
            | xargs -r -I{} dirname {} \
            | sort -u \
            | jq -Rc '.' | jq -sc '.')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  lint:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ${{ matrix.arch.runner }}
    container:
      image: fedora:44
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.detect.outputs.packages) }}
        arch:
          - { runner: ubuntu-latest, name: amd64 }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
    name: lint / ${{ matrix.arch.name }} / ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install tools
        run: dnf install -y --quiet rpmlint rpm-build

      - name: rpmlint
        run: |
          spec=$(find "${{ matrix.pkg }}" -name '*.spec' | head -1)
          rpmlint --define "dist .oreon11" "$spec"

      - name: rpmspec parse
        run: |
          spec=$(find "${{ matrix.pkg }}" -name '*.spec' | head -1)
          rpmspec --parse --define "dist .oreon11" "$spec" > /dev/null

  report:
    needs: [detect, lint]
    if: always() && needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: { jobs: allJobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const lintJobs = allJobs.filter(j => j.name.startsWith('lint /'));
            const icon = c => ({ success: '✅', failure: '❌', cancelled: '⏸️' }[c] ?? '⏳');

            const rows = lintJobs.map(j => {
              const [, arch, ...rest] = j.name.split(' / ');
              const pkg = rest.join(' / ').split('/').pop();
              const url = j.html_url;
              return `| [\`${pkg}\`](${url}) | ${arch} | ${icon(j.conclusion)} ${j.conclusion ?? 'in progress'} |`;
            }).join('\n');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- oreon-ci-lint -->';
            const body = [
              marker,
              `### Spec Lint — [run #${context.runNumber}](${runUrl})`,
              '',
              '| Package | Architecture | Result |',
              '|---------|-------------|--------|',
              rows,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
