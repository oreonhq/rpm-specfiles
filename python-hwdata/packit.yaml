upstream_project_url: https://github.com/xsuchy/python-hwdata
upstream_tag_template: python-hwdata-{version}-1
issue_repository: https://github.com/xsuchy/python-hwdata
copy_upstream_release_description: false

jobs:
- job: pull_from_upstream
  trigger: release
  dist_git_branches:
    - rawhide

- job: koji_build
  trigger: commit
  allowed_committers: ['packit']
  dist_git_branches:
    - fedora-all

- job: bodhi_update
  trigger: commit
  dist_git_branches:
    - fedora-all
